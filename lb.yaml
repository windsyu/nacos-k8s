apiVersion: v1
kind: Service
metadata:
  name: nacos-external
  namespace: default
spec:
  type: LoadBalancer
  selector:
    app: nacos-custom
    component: nacos
    middleware: nacos
  ports:
    - name: httpplus
      port: 8848
      targetPort: 8848
    - name: http
      port: 8080
      targetPort: 8080
    # - name: rpc
    #   port: 7848
    #   targetPort: 7848
    # - name: grpc
    #   port: 9848
    #   targetPort: 9848
